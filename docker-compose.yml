services:
  start_processing:
    container_name: start_processing
    image: <registry>.azurecr.io/spasilacai:latest
    command: python3 /app/src/start_processing.py
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/tegra:$LD_LIBRARY_PATH
    volumes:
      - /usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/nvidia:ro
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
      - /dev:/dev
      - /sys:/sys:ro
      - /proc:/proc:ro
      - ~/logs:/logs
      - ~/config:/app/config
      - ~/frames:/app/frames
      - ~/models:/app/models
      - ~/models_metadata:/app/models_metadata
    runtime: nvidia
    network_mode: host
    restart: unless-stopped

  check_models:
    container_name: check_models
    image: <registry>.azurecr.io/spasilacai:latest
    command: python3 -u /app/src/action_recognition/check_model_registry.py
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/tegra:$LD_LIBRARY_PATH
    volumes:
      - /usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/nvidia:ro
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
      - /dev:/dev
      - /sys:/sys:ro
      - /proc:/proc:ro
      - ~/logs:/logs
      - ~/config:/app/config
      - ~/frames:/app/frames
      - ~/models:/app/models
      - ~/models_metadata:/app/models_metadata
      - /var/run/docker.sock:/var/run/docker.sock
    runtime: nvidia
    network_mode: host
    privileged: true 
    restart: unless-stopped

  recording:
    container_name: recording
    image: <registry>.azurecr.io/spasilacai:latest
    command: tail -f /dev/null
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/tegra:$LD_LIBRARY_PATH
    volumes:
      - ~/logs:/logs
      - ~/config:/app/config
      - ~/records:/records
      - /var/run/docker.sock:/var/run/docker.sock
    runtime: nvidia
    network_mode: host
    privileged: true
    restart: "no"
